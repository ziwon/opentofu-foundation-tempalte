<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Checks on every pull request and on trusted apply</title>
  <desc id="desc">Every pull request runs format and layout checks, validation with mocked plans, TFLint, a Trivy source scan, and a local apply and destroy smoke test. The optional Atlantis workflow plans, scans the saved plan, requires Code Owner approval, and applies that same plan.</desc>

  <rect width="1200" height="420" rx="24" fill="#F7F5EF"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#D9D5CA" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#15171A">
    <text x="52" y="64" font-size="18" letter-spacing="1.5" fill="#5F646B">EVERY PULL REQUEST · CI</text>
    <g id="ci" font-size="20">
      <g transform="translate(52 86)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">fmt + layout</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">tofu get</text>
      </g>
      <g transform="translate(276 86)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">validate</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">mocked plans</text>
      </g>
      <g transform="translate(500 86)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">TFLint</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">pinned rules</text>
      </g>
      <g transform="translate(724 86)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">Trivy source</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">HIGH, CRITICAL</text>
      </g>
      <g transform="translate(948 86)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">local smoke</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">apply, destroy</text>
      </g>
      <g stroke="#15171A" stroke-width="2">
        <path d="M252 132 H276 M476 132 H500 M700 132 H724 M924 132 H948"/>
      </g>
    </g>

    <text x="52" y="254" font-size="18" letter-spacing="1.5" fill="#5F646B">TRUSTED APPLY · ATLANTIS (OPTIONAL)</text>
    <g id="atlantis" font-size="20">
      <g transform="translate(52 276)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">plan</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">saved PLANFILE</text>
      </g>
      <g transform="translate(276 276)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">Trivy plan</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">no inline ignores</text>
      </g>
      <g transform="translate(500 276)">
        <rect width="200" height="92" rx="14" fill="#FFDA18" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">approval</text>
        <text x="18" y="68" font-size="17" fill="#3A3D42">Code Owners</text>
      </g>
      <g transform="translate(724 276)">
        <rect width="200" height="92" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="18" y="38">apply</text>
        <text x="18" y="68" font-size="17" fill="#5F646B">the same plan</text>
      </g>
      <g stroke="#15171A" stroke-width="2">
        <path d="M252 322 H276 M476 322 H500 M700 322 H724"/>
      </g>
    </g>
  </g>
</svg>

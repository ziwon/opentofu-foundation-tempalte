<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Three environments, one stack, reusable modules</title>
  <desc id="desc">The dev, stage, and prod roots under live/ each own their state, lock file, and inputs. All three call the same stack, stacks/aws/storage/bucket, which composes the kms-key and s3-bucket core modules.</desc>

  <rect width="1200" height="500" rx="24" fill="#F7F5EF"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#D9D5CA" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#15171A">
    <g id="headers" font-size="18" letter-spacing="1.5" fill="#5F646B">
      <text x="56" y="66">LIVE ROOTS · run tofu here</text>
      <text x="530" y="66">STACK · one purpose</text>
      <text x="900" y="66">CORE MODULES</text>
    </g>

    <g id="roots" font-size="20">
      <g transform="translate(56 96)">
        <rect width="410" height="96" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="20" y="38">live/dev/aws/storage/bucket</text>
        <text x="20" y="72" font-size="17" fill="#5F646B">own state · own lock · own inputs</text>
      </g>
      <g transform="translate(56 214)">
        <rect width="410" height="96" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="20" y="38">live/stage/aws/storage/bucket</text>
        <text x="20" y="72" font-size="17" fill="#5F646B">own state · own lock · own inputs</text>
      </g>
      <g transform="translate(56 332)">
        <rect width="410" height="96" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="20" y="38">live/prod/aws/storage/bucket</text>
        <text x="20" y="72" font-size="17" fill="#5F646B">own state · own lock · own inputs</text>
      </g>
    </g>

    <g id="calls" fill="none" stroke="#15171A" stroke-width="2">
      <path d="M466 144 C498 144 498 262 530 262"/>
      <path d="M466 262 H530"/>
      <path d="M466 380 C498 380 498 262 530 262"/>
    </g>

    <g id="stack" transform="translate(530 202)" font-size="20">
      <rect width="320" height="120" rx="14" fill="#FFDA18" stroke="#15171A" stroke-width="2"/>
      <text x="20" y="42">stacks/aws/</text>
      <text x="20" y="70">storage/bucket</text>
      <text x="20" y="102" font-size="17" fill="#3A3D42">module "key" · "bucket"</text>
    </g>

    <g id="composes" fill="none" stroke="#15171A" stroke-width="2">
      <path d="M850 238 C875 238 875 158 900 158"/>
      <path d="M850 286 C875 286 875 366 900 366"/>
    </g>

    <g id="modules" font-size="20">
      <g transform="translate(900 110)">
        <rect width="244" height="96" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="20" y="38" font-size="17" fill="#5F646B">modules/aws/</text>
        <text x="20" y="70">kms-key</text>
      </g>
      <g transform="translate(900 318)">
        <rect width="244" height="96" rx="14" fill="#FFFFFF" stroke="#15171A" stroke-width="2"/>
        <text x="20" y="38" font-size="17" fill="#5F646B">modules/aws/</text>
        <text x="20" y="70">s3-bucket</text>
      </g>
    </g>

    <text x="56" y="468" font-size="17" fill="#5F646B">Every root also calls modules/context for its &lt;namespace&gt;-&lt;name&gt;-&lt;environment&gt; ID and tags.</text>
  </g>
</svg>
